        darkMode: 'class',

    <!-- Custom CSS -->
    <style>
      html, body {
        margin: 0;
        background-color: #131314;
        color: #E8EAED;
        font-family: 'Inter', sans-serif;
        overflow-y: auto;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Scrollbars */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #131314; }
      ::-webkit-scrollbar-thumb { background: #3C4043; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #5F6368; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Utilities */
      .gemini-gradient-text {
        background: linear-gradient(to right, #8AB4F8, #C58AF9, #F885C2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      /* Gradient Border CSS */
      .google-gradient-border {
        position: relative;
        background: #1E1F20;
        border: 1px solid #374151;
        transition: border-color 0.3s ease;
      }
      .google-gradient-border:hover {
        border-color: transparent;
      }
      .google-gradient-border::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        background: linear-gradient(to right, #4285F4, #EA4335, #FBBC04, #34A853);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 25; /* Sits on top of Read-More overlay (z-20) */
      }
      .google-gradient-border:hover::after {
        opacity: 1;
      }

      /* Loading Animation */
      .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
    </style>

<body>
    <!-- Loading State -->
    <div id="loading" style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#131314; z-index:100;">
        <div class="loading-pulse" style="width: 48px; height: 48px; background: #4285F4; border-radius: 50%; margin-bottom: 16px;"></div>
        <div style="color: #9CA3AF; font-size: 14px; font-weight: 500;">Loading Resources...</div>
    </div>

    <!-- Error State -->
    <div id="error-container" style="display:none; padding:20px; color:#EF4444; background:#1F2937; margin:20px; border-radius:8px; font-family: monospace; white-space: pre-wrap; position:relative; z-index:101;"></div>

    <!-- App Root -->
    <div id="root"></div>

    <script>
      // Global Error Trap
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global Error:', message, 'at', source, ':', lineno, colno);
        const loading = document.getElementById('loading');
        const errContainer = document.getElementById('error-container');
        if (loading) loading.style.display = 'none';
        if (errContainer) {
          errContainer.style.display = 'block';
          errContainer.textContent = `Error: ${message}\nSource: ${source}\nLine: ${lineno}\nCol: ${colno}\nDetail: ${error?.stack || 'N/A'}`;
        }
      };
    </script>

    <script type="text/babel" data-type="module" crossorigin="anonymous">

        const DemoType = {

          INFOSHEET: 'Infosheet (PDF)',

        // --- 2. DATA ---
        
        const rawChatbotData = [
          { t: "Gemini Agent: Infosheet", l: "https://drive.google.com/file/d/1Vrfl7dFMj6k0VQUkSAMqrXSBG8C_19hj/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "agent, agentic support, gemini", p: "", type: DemoType.INFOSHEET },
          { t: "Gemini Agent: Video", l: "https://drive.google.com/file/d/1Q3H1fWzvQkj2ZGsC2LkHAzZY_oTBd60p/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "agent, agentic support, gemini", p: "Everyday user", type: DemoType.VIDEO },
          { t: "Gemini Gems: Infosheet", l: "https://drive.google.com/file/d/1HgUO0ywQgTKGEv40ONPrNKiF12WGsi_h/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gems, custom gem, creation, gemini", p: "Everyday user", type: DemoType.INFOSHEET },
          { t: "Gemini Gems: Video", l: "https://drive.google.com/file/d/1s--Kiuqe9ErNNSwDth9JbIZxZmtS-H2j/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gems, custom gem, creation, gemini", p: "Everyday user", type: DemoType.VIDEO },
          { t: "Omni Infosheet", l: "https://drive.google.com/file/d/1GtRcou5jZCxr6Jns_-EJBBd1hLj9cb21/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "omni, gen AI, generative, image, video, design, creativity", p: "Everyday user", type: DemoType.INFOSHEET },
          { t: "Nano Banana Infosheet", l: "https://drive.google.com/file/d/1gco8B8647avu5l2q8YvwlKC82aiQNGfY/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "nano banana, gen AI, generative, image, video, design, creativity", p: "Everyday user", type: DemoType.INFOSHEET },
          { t: "Nano Banana & Omni: Video", l: "https://drive.google.com/file/d/14uiuROn1Xsyz36CySa48e2_1dkK1sudW/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "nano banana, omni, gen AI, generative, image, video, design, creativity", p: "Everyday user", type: DemoType.VIDEO },
          { t: "Deep Research: Infosheet", l: "https://drive.google.com/file/d/14dOvx8J5hrrihvDZHUiML_1hbKJvJ2jm/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "deep research, learning, gemini", p: "Everyday user", type: DemoType.INFOSHEET },
          { t: "Canvas: Infosheet", l: "https://drive.google.com/file/d/18kMYciYx1bypGyHua24VtcKWSNGzHGS_/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gemini, canvas, design, visual", p: "Everyday user", type: DemoType.INFOSHEET },
          { t: "Deep Research & Canvas: Video", l: "https://drive.google.com/file/d/1BeVq48oxNmSSMV0UXlqYlBugrKRRc1-K/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gemini, canvas, design, visual, deep research, learning", p: "Everyday user", type: DemoType.VIDEO },
          { t: "Gemini Notebook Audio & Video Overview: Video", l: "https://drive.google.com/file/d/19L5PWHON_pl5W7Fspvv3F2F95jiDHfmD/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gemini notebook, learning, productivity, video, audio, overview", p: "", type: DemoType.VIDEO },
          { t: "Gemini Notebook Audio & Video Overview: Infosheet", l: "https://drive.google.com/file/d/1ZTB_JlpA_OMeY0v-Q0nU8cBNCm95tvX6/view?usp=drive_link", d: "Did You Know Series (2026)", tags: "gemini notebook, learning, productivity, video, audio, overview", p: "", type: DemoType.INFOSHEET },
          { t: "Gemini on ChromeOS: Infosheet", l: "https://drive.google.com/file/d/1qRIu0Md0LKw87Z_eZIw7oPprBbP3lPB7/view?usp=sharing", d: "Overview of Gemini features and integration on ChromeOS.", tags: "Gemini, foundation, introduction, demos, integration, Workspace tools", p: "General", type: DemoType.INFOSHEET },
          { t: "Gemini Sidebar in Chrome", l: "https://drive.google.com/file/d/1kH2RETW6jvtuFcdpcHUG5uaCATeQ5n-h/view?usp=sharing", d: "Demo showing the Gemini sidebar experience on Chromebook Plus.", tags: "gemini tools, sidebar, gemini in chrome, chrome browser, agent, agentic support", p: "General", type: DemoType.INFOSHEET },
          { t: "Basics of Chromebook eLearning", l: "https://drive.google.com/file/d/1vqxuEP86YfPGeYdyyCt9OmtfSfqvICeg/view?usp=sharing", d: "15 minute foundational eLearning for baseline Chromebook knowledge. Partners without an eLearning platform can view the module through the Articulate web player link: https://share.articulate.com/s7w053UVQ07i08mKhOGHHn", tags: "foundations, chromebook, chromebook plus, chromeOS, introduction", p: "General", type: DemoType.INTERACTIVE },
          { t: "The Value of ChromeOS", l: "https://drive.google.com/file/d/1l4U5fijAeRYGzms1h_ywAtjmBmx4Gg_u/view?usp=sharing", d: "A video overview highlighting the core value proposition and benefits of ChromeOS.", tags: "foundations, chromebook, chromeOS, perks, offers, value", p: "General", type: DemoType.VIDEO },
          { t: "Google Brand Familiarity", l: "https://drive.google.com/file/d/1jrd8I0U0ZcjKSC37wHUCEMqYdv2UcOPn/view?usp=sharing", d: "A guide to understanding Google's brand ecosystem and workspace familiarity.", tags: "google workspace, youtube, gmail, photos, android, ecosystem, beto, better together", p: "General", type: DemoType.VIDEO },
          { t: "Better Together with Gemini", l: "https://drive.google.com/file/d/1gtjxJ-dFpJv0nZxqSob-G_mKsT5NE0dh/view?usp=sharing", d: "Explore hardware interoperability and how devices work better together with Gemini.", tags: "hardware, interoperability, gemini, better together, beto, ecosystem", p: "General", type: DemoType.INFOSHEET },
          { t: "Gemini Prompting Guide: Demos", l: "https://docs.google.com/presentation/d/17UACptOsySwB8YxZN8V5NqCbLd8cJukiEV15A1z_Iyc/edit?usp=sharing", d: "A comprehensive slide deck covering Gemini prompting techniques and live demo scenarios.", tags: "Gemini, prompting, canvas, deep research, storybook, guided learning, gems, image, video, generation, nano banana, omni, gen AI", p: "General", type: DemoType.DECK },
          { t: "Back to School with Gemini: In-Store Demos (B2S 2026)", l: "https://drive.google.com/file/d/1ZmBmZQx8c1Agr0ZTFCpU_eiynhuCBAJS/view?usp=drive_link", d: "Back to School with Gemini in-store live product demo scenarios and presentation guide.", tags: "B2S, Back to School, EDU, Classroom, Students, Study, Google AI", p: "General", type: DemoType.INFOSHEET },
          { t: "Gemini Study Tips (B2S 2026)", l: "https://drive.google.com/file/d/1cPO4VhhppV7Z5nwlhUm_vPM_JMY-q2KM/view?usp=drive_link", d: "Partners without an eLearning platform can view the module through the Articulate web player link here: https://share.articulate.com/XuFSGPMpYGdQF8fTEOdAq", tags: "B2S, Back to School, EDU, Classroom, Students, Study, Google AI, Productivity", p: "General", type: DemoType.INTERACTIVE },
          { t: "Learning with Gemini Notebook (B2S 2026)", l: "https://drive.google.com/file/d/1Dm_7y8pa2OnTCtZbj3aEyox2Z-li5B4S/view?usp=drive_link", d: "Partners without an eLearning platform can view the module through the Articulate web player link here: https://share.articulate.com/efQ7VBllQjLyHA19mDX_0", tags: "B2S, Back to School, EDU, Classroom, Students, Productivity, Gemini Notebook, Notebooks, New", p: "General", type: DemoType.INTERACTIVE },
          { t: "General Summary: Gemini Trust and Safety Guide", l: "https://docs.google.com/presentation/d/12TvLVwOsjlVnZmKMw--SQT5tjak8ffDIwI-sm5Uf2P4/edit?usp=sharing", d: "A comprehensive guide on Gemini trust, safety, and security policies.", tags: "Gemini, trust, safety, security, privacy, guidelines", p: "General", type: DemoType.DECK }
        ];


        // --- 3. HELPER FUNCTIONS ---

        const getTypeIcon = (type) => {
          switch (type) {
            case DemoType.GIF:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <PlayCircle className="w-4 h-4 text-google-blue" />
                  <span className="text-[8px] font-bold text-google-blue uppercase leading-none">Demo</span>
                </div>
              );
            case DemoType.INFOSHEET:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <FileText className="w-4 h-4 text-google-green" />
                  <span className="text-[8px] font-bold text-google-green uppercase leading-none">Infosheet</span>
                </div>
              );
            case DemoType.DECK:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <Presentation className="w-4 h-4 text-google-green" />
                  <span className="text-[8px] font-bold text-google-green uppercase leading-none">Slides</span>
                </div>
              );
            case DemoType.VIDEO:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <PlayCircle className="w-4 h-4 text-google-green" />
                  <span className="text-[8px] font-bold text-google-green uppercase leading-none">Video</span>
                </div>
              );
            case DemoType.INTERACTIVE:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <MonitorPlay className="w-4 h-4 text-google-green" />
                  <span className="text-[8px] font-bold text-google-green uppercase leading-none">eLearning</span>
                </div>
              );
            case DemoType.WEBPAGE:
              return (
                <div className="flex flex-col items-center gap-0.5">
                  <Globe className="w-4 h-4 text-google-blue" />
                  <span className="text-[8px] font-bold text-google-blue uppercase leading-none">Web</span>
                </div>
              );
            default: return <FileText className="w-4 h-4 text-gray-400" />;
          }
        };

        const getFormatLabel = (type) => {
          switch (type) {
            case DemoType.GIF: return 'GIF';
            case DemoType.INFOSHEET:
            case DemoType.DECK: return 'PDF';
            case DemoType.VIDEO: return 'MP4';
            case DemoType.INTERACTIVE: return 'SCORM';
            case DemoType.WEBPAGE: return 'WEB';
            default: return 'FILE';
          }
        };

        const toTitleCase = (str) => {
          let formatted = str.replace(/\w\S*/g, (txt) => {
            return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
          });
          formatted = formatted
            .replace(/Gemini/gi, 'Gemini')
            .replace(/\bAi\b/gi, 'AI')
            .replace(/Non-Ai/gi, 'Non-AI')
            .replace(/Cb/g, 'CB')
            .replace(/CB Plus/gi, 'CB PLUS')
            .replace(/Pc/g, 'PC')
            .replace(/Llm/g, 'LLM')
            .replace(/\bTv\b/g, 'TV')
            .replace(/\bYoutube\b/g, 'YouTube')
            .replace(/\bWifi\b/g, 'Wi-Fi')
            .replace(/Geforce Now/gi, 'GeForce NOW')
            .replace(/Chromeos/gi, 'ChromeOS')
            .replace(/Chrome Os/gi, 'ChromeOS')
            .replace(/Notebooklm/gi, 'Gemini Notebook')
            .replace(/NotebookLM/gi, 'Gemini Notebook')
            .replace(/\bB2s\b/gi, 'B2S')
            .replace(/Imagen/gi, 'Nano Banana');
          return formatted;
        };

        const cleanDescription = (str) => {
          let cleaned = str.replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
          cleaned = cleaned.replace(/\bai\b/gi, 'AI');
          cleaned = cleaned.replace(/Geforce Now/gi, 'GeForce NOW');
          cleaned = cleaned.replace(/Chromeos/gi, 'ChromeOS');
          cleaned = cleaned.replace(/Chrome Os/gi, 'ChromeOS');
          cleaned = cleaned.replace(/Notebooklm|NotebookLM/gi, 'Gemini Notebook');
          cleaned = cleaned.replace(/Imagen/gi, 'Nano Banana');
          if (cleaned.length > 0 && !cleaned.endsWith('.') && !cleaned.endsWith(')') && !cleaned.toLowerCase().includes('did you know series')) {
            cleaned += '.';
          }
          return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
        };

        const detectTool = (title, desc) => {
          const t = (title + ' ' + desc).toLowerCase();
          const tools = [];
          
          if (t.includes('veo') || t.includes('omni')) tools.push('Omni');
          if (t.includes('extensions:')) tools.push('Extensions');
          if (t.includes('canvas')) tools.push('Canvas');
          if (t.includes('imagen') || t.includes('image generation') || t.includes('nano banana')) tools.push('Nano Banana');
          if (t.includes('deep research')) tools.push('Deep Research');
          
          if (t.includes('help me write')) {
            if (t.includes('quick insert')) tools.push('On-Device Google AI');
            else tools.push('Help Me Write');
          }
          if (t.includes('help me read')) {
            tools.push('On-Device Google AI');
          }
          
          if (t.includes('agent')) tools.push('Agent');
          if (t.includes('gem:') || t.includes('gem ') || t.includes('gems')) tools.push('Gems');
          if (t.includes('notebooklm') || t.includes('gemini notebook')) tools.push('Gemini Notebook');
          if (t.includes('sidebar')) tools.push('Sidebar');

          if (t.includes('lens') || t.includes('select to search')) {
            if (t.includes('text capture') || t.includes('shopping')) tools.push('On-Device Google AI');
            else tools.push('Google Lens');
          }
          if (t.includes('magic eraser') || t.includes('photos')) tools.push('Google Photos');
          if (t.includes('google meet')) tools.push('Google Meet');
          if (t.includes('slides') || t.includes('slide') || t.includes('presentation')) tools.push('Slides');
          if ((t.includes('sheets') || t.includes('sheet') || t.includes('spreadsheet') || t.includes('budget')) && !t.includes('infosheet')) tools.push('Sheets');
          if (t.includes('docs') || t.includes('doc') || t.includes('document')) {
            if (!t.includes('infosheet')) tools.push('Docs');
          }
          if (t.includes('gmail') || t.includes('email')) tools.push('Gmail');
          if (t.includes('calendar')) tools.push('Calendar');
          if (t.includes('workspace')) tools.push('Google Workspace Tools');
          
          if (t.includes('translate')) {
            if (t.includes('live translate')) tools.push('On-Device Google AI');
            else tools.push('Google Workspace Tools');
          }
          if (t.includes('perks') || t.includes('perk')) tools.push('Perks');
          if (t.includes('quick insert') || t.includes('smart tab grouping')) tools.push('On-Device Google AI');
          if (t.includes('face control')) tools.push('On-Device Google AI');
          
          if (tools.length === 0 && t.includes('gemini')) {
            tools.push('Gemini');
          }
          
          return tools.length > 0 ? tools : ['Gemini'];
        };

        const parseStatusAndDate = (title) => {
          const readyByRegex = /Ready by ([\d\/]+|TBD)/i;
          const match = title.match(readyByRegex);
          let cleanTitle = title.replace(readyByRegex, '').replace(/\n/g, '').replace(/\*/g, '').trim();
          cleanTitle = cleanTitle.replace(/^"|"$/g, '');
          
          if (match) {
            return {
              cleanTitle: cleanTitle,
              status: DemoStatus.IN_PRODUCTION,
              date: match[1]
            };
          }
          return {
            cleanTitle: cleanTitle,
            status: DemoStatus.LIVE
          };
        };

        // --- 4. DATA AGGREGATION ---

        const CHATBOT_DEMOS = rawChatbotData.map((item, index) => {
          const { cleanTitle, status, date } = parseStatusAndDate(item.t);
          let profile = item.p.replace(/^"|"$/g, '').replace(/\n/g, ' & ');
          if (profile === 'Family') profile = 'Family (Shared Device)';
          
          const isValidUrl = item.l && (item.l.startsWith('http') || item.l.startsWith('www'));
          
          let finalStatus = status;
          let finalDate = date;
          
          if (isValidUrl) {
            finalStatus = DemoStatus.LIVE;
            finalDate = undefined;
          } else {
            finalStatus = DemoStatus.IN_PRODUCTION;
            if (!finalDate) finalDate = 'TBD';
          }
          
          let tools = detectTool(cleanTitle, item.d);
          
          if (cleanTitle.toLowerCase().includes('server mapping')) {
            tools = ['Gemini'];
          } else {
            tools = tools.map(tool => {
              if (tool === 'Google Lens') return 'On-Device Google AI';
              const workspaceApps = ['Sheets', 'Slides', 'Docs', 'Gmail', 'Calendar', 'Google Meet'];
              if (workspaceApps.includes(tool)) return tool;
              
              if (['Help Me Read', 'Help Me Write', 'Quick Insert', 'Google Photos', 'Live Translate', 'Smart Tab Grouping'].includes(tool)) {
                return 'On-Device Google AI';
              }
              return tool;
            });
          }
          
          let finalTools = Array.from(new Set(tools));
          
          const hasSpecificApp = finalTools.some(t => ['Sheets', 'Slides', 'Docs', 'Gmail', 'Calendar', 'Google Meet'].includes(t));
          if (hasSpecificApp) {
            finalTools = finalTools.filter(t => t !== 'Google Workspace Tools');
          }

          if (finalTools.includes('Gemini') && finalTools.includes('On-Device Google AI')) {
            finalTools = finalTools.filter(t => t !== 'Gemini');
          }
          
          return {
            id: `cb-${cleanTitle.toLowerCase().replace(/[^a-z0-9]/g, '-')}`,
            title: toTitleCase(cleanTitle),
            description: cleanDescription(item.d),
            url: isValidUrl ? item.l : '#', 
            source: DemoSource.CHATBOT_PROJECT,

                    <input
                      type="text"
                      className="block w-full pl-9 pr-3 py-2 bg-[#1E1F20] border border-gray-700 rounded-md text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-google-blue focus:ring-1 focus:ring-google-blue transition-all"
                      placeholder="Search by title, description, or tool..."
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                    />
                  </div>
                </div>

                <div className="flex items-center gap-4 py-2 text-xs border-t border-b border-gray-800 overflow-x-auto no-scrollbar">
                  <div className="flex items-center gap-2 text-gray-500"><Filter className="w-3 h-3" /></div>
                  <select 
                    value={selectedType}
                    onChange={(e) => setSelectedType(e.target.value)}
                    className="bg-transparent border-none text-gray-300 focus:ring-0 cursor-pointer hover:text-white"
                  >
                    {types.map(t => <option key={t} value={t} className="bg-[#1E1F20]">{t === 'All' ? 'All Formats' : t}</option>)}
                  </select>
                </div>
              </div>

              <div className="space-y-4 mt-4">
                {categories.map((cat, index) => {
                  const group = groupedData[cat];
                  const demos = group?.items || [];
                  const subGroups = group?.subGroups || {};
                  
                  const subGroupEntries = Object.entries(subGroups).sort(([a], [b]) => {
                    if (cat === 'Device Portfolio') {
                      const order = ['CB Standard', 'CB Plus', 'Googlebook', 'Competition'];
                      return order.indexOf(a) - order.indexOf(b);
                    }
                    return a.localeCompare(b);
                  });
                  const totalCount = demos.length + subGroupEntries.reduce((acc, [_, sub]) => acc + sub.items.length + (sub.nested ? Object.values(sub.nested).reduce((nAcc, nList) => nAcc + nList.length, 0) : 0), 0);
                  const isSearching = search.trim().length > 0;
                  
                  if (totalCount === 0 && isSearching) return null;

                  const isOpen = sectionsOpen[cat] || isSearching;
                  
                  return (
                    <div key={cat} className="rounded-lg overflow-hidden border border-gray-800">
                      <SectionHeader 
                        title={cat} 
                        totalCount={totalCount}
                        colorClass={sectionColors[index % sectionColors.length]} 
                        isOpen={isOpen}
                        onToggle={() => setSectionsOpen(prev => ({...prev, [cat]: !prev[cat]}))}
                      />
                      {isOpen && (
                        <div className="bg-[#131314] p-3">
                          {demos.length > 0 && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                              {demos.map((item, idx) => <CompactRow key={item.id} item={item} index={idx} />)}
                            </div>
                          )}
                          
                          {subGroupEntries.length > 0 && (
                            <div className="space-y-2">
                              {subGroupEntries.filter(([_, sub]) => !isSearching || (sub.items.length > 0 || (sub.nested && Object.values(sub.nested).some(l => l.length > 0)))).map(([subCat, subData]) => {
                                const isSubOpen = subSectionsOpen[subCat] || isSearching;
                                return (
                                  <div key={subCat} className="border border-gray-800/50 rounded-lg overflow-hidden">
                                    <div 
                                      onClick={() => setSubSectionsOpen(prev => ({...prev, [subCat]: !prev[subCat]}))}
                                      className="flex items-center gap-2 px-4 py-2 bg-[#18191A] hover:bg-[#1E1F20] cursor-pointer transition-colors group"
                                    >
                                      {isSubOpen ? <ChevronDown className="w-3 h-3 text-gray-600" /> : <ChevronRight className="w-3 h-3 text-gray-600" />}
                                      <span className="text-[10px] font-bold uppercase tracking-widest text-gray-500 group-hover:text-gray-300">{subCat}</span>
                                      <span className="text-[9px] text-gray-700 ml-auto font-mono">({subData.items.length + (subData.nested ? Object.values(subData.nested).reduce((acc, l) => acc + l.length, 0) : 0)})</span>
                                    </div>
                                    
                                    {isSubOpen && (
                                      <div className="bg-[#131314] p-3 space-y-3">
                                        {subData.items.length > 0 && (
                                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {subData.items.map((item, idx) => <CompactRow key={item.id} item={item} index={idx} />)}
                                          </div>
                                        )}
                                        
                                        {subData.nested && Object.entries(subData.nested).sort(([a], [b]) => a.localeCompare(b)).map(([nestedTitle, nestedItems]) => {
                                          const isNestedOpen = subSectionsOpen[nestedTitle] || isSearching;
                                          return (
                                            <div key={nestedTitle} className="border border-gray-800/30 rounded-lg overflow-hidden ml-2">
                                              <div 
                                                onClick={() => setSubSectionsOpen(prev => ({...prev, [nestedTitle]: !prev[nestedTitle]}))}
                                                className="flex items-center gap-2 px-3 py-1.5 bg-[#1C1D1E] hover:bg-[#202122] cursor-pointer transition-colors group"
                                              >
                                                {isNestedOpen ? <ChevronDown className="w-2.5 h-2.5 text-gray-600" /> : <ChevronRight className="w-2.5 h-2.5 text-gray-600" />}
                                                <span className="text-[9px] font-bold uppercase tracking-widest text-gray-500 group-hover:text-gray-300">{nestedTitle}</span>
                                                <span className="text-[8px] text-gray-700 ml-auto font-mono">({nestedItems.length})</span>
                                              </div>
                                              
                                              {isNestedOpen && (
                                                <div className="bg-[#111112] p-2">
                                                  {nestedItems.length > 0 ? (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                      {nestedItems.map((item, idx) => <CompactRow key={item.id} item={item} index={idx} />)}
                                                    </div>
                                                  ) : (
                                                    <div className="py-2 text-[9px] text-gray-600 italic text-center">No resources available in this section.</div>
                                                  )}
                                                </div>
                                              )}
                                            </div>
                                          );
                                        })}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          {totalCount === 0 && <div className="py-8 text-center text-xs text-gray-600">No resources found in this category.</div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              {filteredData.length === 0 && (
                <div className="text-center py-20">
                  <Search className="w-12 h-12 text-gray-700 mx-auto mb-4" />
                  <h3 className="text-gray-400 font-medium">No results found</h3>
                </div>
              )}
            </div>
          );
        };

        const App = () => {
          useEffect(() => {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
          }, []);

          return (
            <div className="min-h-screen bg-[#131314] text-[#E8EAED] font-sans flex flex-col">
              <nav className="sticky top-0 z-50 bg-[#131314]/80 backdrop-blur border-b border-gray-800">
                <div className="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 flex items-center justify-center">
                       <img src="https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/gemini-color.png" alt="Gemini Logo" className="w-8 h-8" />
                    </div>
                    <span className="font-semibold text-white tracking-tight text-lg">Chromebook Training Resources Library</span>
                  </div>
                </div>
              </nav>
              <main className="flex-grow pt-8">
                  <LibraryView initialSearch="" initialExpandedSection={null} />
              </main>
              <footer className="border-t border-gray-800 mt-auto py-6 text-center">
                <p className="text-sm text-white mb-2">
                  Please reach out to Emily Franks (<a href="mailto:frankse@google.com" className="text-google-blue hover:underline">frankse@</a>) for the exhaustive demo list or to request additional content or demos.
                </p>
                <p className="text-xs text-gray-600">
                  Internal Use Only • CrOS Training & Enablement • Confidential
                </p>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
